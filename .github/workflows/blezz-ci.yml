name: Blezz changed-area checks

on:
  pull_request:
    branches: [blezz]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'ops/blezz/**'
      - '.github/workflows/blezz-*.yml'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'install.sh'

permissions:
  contents: read

concurrency:
  group: blezz-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.repository == 'blezzbr/agentes-chat'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changed files and select suites
        id: changes
        run: |
          git diff --check HEAD^1 HEAD
          ops/blezz/changed-suites.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.changes.outputs.tests != ''
        with:
          bun-version-file: package.json
      - name: Install workspace dependencies
        if: steps.changes.outputs.tests != ''
        run: bun install --frozen-lockfile
      - name: Run selected suites
        if: steps.changes.outputs.tests != ''
        env:
          TEST_SUITES: ${{ steps.changes.outputs.tests }}
        run: |
          read -r -a suites <<< "$TEST_SUITES"
          for suite in "${suites[@]}"; do
            bun test "$suite"
          done
      - name: Check deployment scripts
        if: steps.changes.outputs.ops == 'true'
        env:
          BACKUP_IMAGE: ghcr.io/agentes-chat/backup:0.1.10
          AGENTES_IMAGE: agentes-blezz:test
          POSTGRES_PASSWORD: ci-only-placeholder
        run: |
          for script in ops/blezz/*.sh; do bash -n "$script"; done
          project=$(mktemp -d)
          touch "$project/.env"
          docker compose --project-directory "$project" -f "$PWD/docker-compose.yml" config --quiet
