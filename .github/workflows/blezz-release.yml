name: Blezz build and delivery

on:
  pull_request:
    branches: [blezz]
  push:
    tags: ['blezz-v*']

permissions:
  contents: read

concurrency:
  group: blezz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.repository == 'blezzbr/agentes-chat'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: version
        name: Verify release version
        run: |
          version=$(jq -er .version apps/server/package.json)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^blezz-v[0-9]+\.[0-9]+\.[0-9]+\.[1-9][0-9]*$ ]]
            [[ "${GITHUB_REF_NAME%.*}" == "blezz-v$version" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agentes-blezz:test
          labels: |
            org.opencontainers.image.source=https://github.com/blezzbr/agentes-chat
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=blezz-amd64
          cache-to: ${{ github.ref_type == 'tag' && 'type=gha,scope=blezz-amd64,mode=max' || '' }}
      - name: Test runner integration
        run: |
          docker run --rm --entrypoint bun agentes-blezz:test test \
            apps/server/test/runner/brain-antigravity.test.ts
      - name: Test Compose, migration, backup and restore
        env:
          UPSTREAM_VERSION: ${{ steps.version.outputs.version }}
        run: ops/blezz/smoke.sh
      - name: Export tested image for publication
        if: github.ref_type == 'tag'
        run: docker save agentes-blezz:test | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref_type == 'tag'
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1

  publish:
    if: github.repository == 'blezzbr/agentes-chat' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and delivery bundle
        run: |
          set -euo pipefail
          image="ghcr.io/blezzbr/agentes-chat:$GITHUB_REF_NAME"
          backup="ghcr.io/agentes-chat/backup:$UPSTREAM_VERSION"
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && !seen++ { print $2 }'
          }

          docker load -i image.tar.gz
          docker tag agentes-blezz:test "$image"
          docker push "$image"
          image_digest=$(digest "$image")
          backup_digest=$(digest "$backup")
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ && "$backup_digest" =~ ^sha256:[a-f0-9]{64}$ ]]

          mkdir delivery
          cp docker-compose.yml ops/blezz/stage.sh delivery/
          container=$(docker create agentes-blezz:test)
          docker cp "$container:/app/apps/web/dist/runner/agentes-runner.mjs" delivery/agentes-runner.mjs
          docker rm "$container"
          cat > delivery/images.env <<IMAGES
          AGENTES_IMAGE=ghcr.io/blezzbr/agentes-chat@$image_digest
          AGENTES_BACKUP_IMAGE=ghcr.io/agentes-chat/backup@$backup_digest
          UPSTREAM_VERSION=$UPSTREAM_VERSION
          IMAGES
          (
            cd delivery
            sha256sum docker-compose.yml stage.sh agentes-runner.mjs images.env > SHA256SUMS
          )
          tar -czf blezz-linux-amd64.tar.gz -C delivery .
          gh release create "$GITHUB_REF_NAME" blezz-linux-amd64.tar.gz \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Blezz build based on upstream v$UPSTREAM_VERSION. Source commit: $GITHUB_SHA."
